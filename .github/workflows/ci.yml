name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN: this workflow only reads the repo. Without an
# explicit block the token inherits the repository default, which on many repos is
# read/write across contents, issues, packages and deployments. Handing every third-party
# action (and anything a compromised dependency runs during `npm ci`) a write-capable token.
# release.yml already declares `permissions: {}` per job; this brings CI in line.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    # Actions are pinned to a full commit SHA, not a mutable tag. `@v7` is a branch-like
    # ref the upstream owner can repoint at any commit, so a tag pin trusts the action
    # owner (and anyone who compromises them) continuously; a SHA is immutable. The
    # trailing comment carries the human-readable version, which is what Dependabot's
    # github-actions ecosystem reads and rewrites on a bump.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      # `npm run build` only compiles src/ (tsconfig.json has rootDir: src and excludes
      # **/*.test.ts, so dist/ ships no test code). That left tests/ and scripts/ with no
      # type checking at all: vitest transpiles each file in isolation and tsx strips
      # types, so a broken type in a test helper or the docs generator surfaced only at
      # runtime, if ever. tsconfig.check.json is the noEmit config that covers all three.
      - run: npm run typecheck

      - run: npm test

      # Docs drift gate: regenerate README tool table + MCPB manifest from the live
      # registry and fail if they differ from what's committed. Pinned to a single
      # Node leg (the generator output is platform-independent, so one run suffices).
      - name: Check generated docs are up to date
        if: matrix.node-version == 22
        run: |
          npm run gen:docs
          git diff --exit-code -- README.md bundle/manifest.json \
            || { echo "::error::README.md or bundle/manifest.json is out of date. Run 'npm run gen:docs' and commit the result."; exit 1; }
