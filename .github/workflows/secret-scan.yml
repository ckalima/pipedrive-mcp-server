name: Secret Scan

# gitleaks runs in two modes depending on the trigger:
#   - pull_request / push: the action scans only the commits in the event (the diff).
#     This is the blocking gate that stops a NEW secret from landing.
#   - schedule / workflow_dispatch: the action scans the ENTIRE git history, giving a
#     mechanical full-history baseline (catches anything that slipped in out-of-band,
#     e.g. a force-push) without relying on a one-off manual sweep.
# A complete clone (fetch-depth: 0) is required so the history-range lookups resolve.
#
# This workflow's job is named `secret-scan`, which becomes a new status check. Add it
# to the main branch-protection required checks once it has run at least once.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history sweep, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN. `contents: read` covers the clone; gitleaks needs
# `pull-requests: write` because it reports a find as a PR review comment (its
# GITLEAKS_ENABLE_COMMENTS behaviour, on by default). Everything else the repository
# default would have granted — issues, packages, deployments, actions — is dropped, which
# matters most here: this workflow hands a third-party action a token on every PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    # SHA-pinned, not tag-pinned: `@v3` is mutable and this job runs a third-party action
    # against every PR with a token that can comment. The trailing comment is the version
    # Dependabot reads and rewrites on a bump.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
