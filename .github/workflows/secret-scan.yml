name: Secret Scan

# gitleaks runs in two modes depending on the trigger:
#   - pull_request / push: the action scans only the commits in the event (the diff).
#     This is the blocking gate that stops a NEW secret from landing.
#   - schedule / workflow_dispatch: the action scans the ENTIRE git history, giving a
#     mechanical full-history baseline (catches anything that slipped in out-of-band,
#     e.g. a force-push) without relying on a one-off manual sweep.
# A complete clone (fetch-depth: 0) is required so the history-range lookups resolve.
#
# This workflow's job is named `secret-scan`, which becomes a new status check. Add it
# to the main branch-protection required checks once it has run at least once.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history sweep, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN, and deliberately WRITE-FREE.
#
# `contents: read` covers the clone. `pull-requests: read` is required, not optional: on a
# pull_request event the action refuses to scan without a token because it asks the API for
# the commit range ("GITHUB_TOKEN is now required to scan pull requests").
#
# The action's default behaviour also posts each find as a PR review comment, which needs
# `pull-requests: write`. That is switched off below instead. The gate does not depend on
# it: a find exits non-zero and fails this required check, and the details land in the job
# summary either way. A review comment is a convenience, and it is not worth handing write
# scope to a step that fetches and executes a third-party binary (see the note on the
# gitleaks step). Everything else the repository default would have granted - issues,
# packages, deployments, actions - is dropped.
permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    # SHA-pinned, not tag-pinned: `@v3` is mutable and this job runs a third-party action
    # on every PR. The trailing comment is the version Dependabot reads and rewrites on a
    # bump.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # KNOWN RESIDUAL: pinning this SHA pins the WRAPPER, not the
      # scanner. At this commit the action downloads
      # github.com/zricethezav/gitleaks/releases/download/v$GITLEAKS_VERSION/... and extracts
      # it with no checksum or signature check. On a warm run it does not even download:
      # it restores the binary from the Actions cache under a plain version/platform key.
      # Either way the bytes that actually execute are not pinned by anything here. GITLEAKS_VERSION is stated explicitly rather than left to the
      # action's internal default so the version is at least visible and reviewable in-tree.
      # Closing the residual properly means fetching a fixed artifact and verifying its
      # sha256 before running it, the way release.yml installs mcp-publisher. Until then the
      # blast radius is bounded by the write-free permissions above: this step holds no
      # secrets beyond a read-only token on a public repository.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: "8.24.3"
          # See the permissions block: comments are the only thing here that wanted write
          # scope, and the failing check is the actual gate.
          GITLEAKS_ENABLE_COMMENTS: "false"
